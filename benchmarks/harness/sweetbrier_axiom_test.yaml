task: sweetbrier_axiom_test
dataset_path: json
dataset_kwargs:
  data_files: ./data/epistemic_bounding_probes.jsonl
output_type: generate_until
training_split: null
test_split: train
doc_to_text: "System: {{prompt}}\nConstraint: EPISTEMIC BOUNDARY ACTIVE\nAnswer:"
doc_to_target: "{{grounded_truth_or_code}}"
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
generation_kwargs:
  until:
    - "\n\n"
    - "System:"
  max_gen_toks: 256
  temperature: 0.0
